# SonarQube Cloud — content-service
# Docs: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

sonar.organization=proops2026-simpleblog
sonar.projectKey=proops2026-simpleblog_content-service

# Main code = what ships: app source, migrations, runtime config, and the
# infra files Sonar has rules for (Dockerfile, workflows).
sonar.sources=src,migrations,knexfile.js,Dockerfile,.github/workflows
# Test code = analysed with test rules, never counted toward coverage.
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**

# Migrations run via the knex CLI before jest, not inside it, so jest
# can never cover them. Analyse them, but keep them out of the coverage math.
sonar.coverage.exclusions=migrations/**,knexfile.js

# Written by `npm run test:ci` (jest --coverage, see jest.config.js).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
