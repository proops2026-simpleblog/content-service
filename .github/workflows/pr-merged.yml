name: Merge — Build + Deploy Dev

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: proops2026-simpleblog/proops2026-cicd-platform/.github/workflows/reusable-build.yml@v2
    with:
      image-name: proops2026-simpleblog/content-service
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-dev:
    needs: build
    uses: proops2026-simpleblog/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v2
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: dev
      image-name: proops2026-simpleblog/content-service
      service-name: content-service
    secrets: inherit
