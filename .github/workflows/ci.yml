name: CI
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  # lint and test have no needs: between them, so they run in parallel.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint   # eslint . --max-warnings 0

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Throwaway Postgres for the integration tests (tests/testUtils.js hits real tables).
    # Matches docker-compose: postgres:16-alpine. Trust auth = no credential to hardcode;
    # the container only lives for this job and is reachable only from this runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/content_db

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # same as Dockerfile node:20-alpine (IRD-006), not the laptop's v24
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
      - run: npm test

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
      packages: write          # only this job can push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # IRD-006: tag = 7-char commit SHA, never latest
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party actions pinned to full commit SHA (tags can be re-pointed)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
