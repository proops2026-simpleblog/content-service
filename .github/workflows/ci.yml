name: CI
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  # lint and test have no needs: between them, so they run in parallel.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint   # eslint . --max-warnings 0

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Throwaway Postgres for the integration tests (tests/testUtils.js hits real tables).
    # Matches docker-compose: postgres:16-alpine. Trust auth = no credential to hardcode;
    # the container only lives for this job and is reachable only from this runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: content_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/content_db

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # same as Dockerfile node:20-alpine (IRD-006), not the laptop's v24
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
      - run: npm test

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
      packages: write          # only this job can push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # IRD-006: tag = 7-char commit SHA, never latest
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party actions pinned to full commit SHA (tags can be re-pointed)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      packages: read           # pull the image from GHCR inside kind
    defaults:
      run:
        shell: bash            # -eo pipefail (plain run: is bash -e only)
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
      NS: blogcms
    steps:
      # Manifests live in the docs repo (IRD-007), not here.
      - uses: actions/checkout@v7
        with:
          repository: proops2026-simpleblog/docs
          path: docs

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ci-${{ github.run_id }}
          wait: 120s

      - name: Create Secrets (random values, cluster dies with the job)
        run: bash docs/k8s/create-secrets.sh   # committed as 100644 (no +x) in docs

      - name: Let the cluster pull from GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull -n "$NS" \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NS" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      # CI overlay = base + this commit's image, same shape as overlays/eks.
      # Only postgres + content-service run; the other apps are removed.
      - name: Build CI overlay
        run: |
          mkdir -p docs/k8s/overlays/ci
          cat > docs/k8s/overlays/ci/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../base
          images:
            - name: content-service
              newName: ${IMAGE%:*}
              newTag: "${IMAGE##*:}"
          patches:
            - target: { kind: Deployment, name: content-service }
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/imagePullPolicy
                  value: IfNotPresent
            - target: { kind: Deployment, name: (user-service|gateway|frontend) }
              patch: |-
                \$patch: delete
                apiVersion: apps/v1
                kind: Deployment
                metadata: { name: unused }
          YAML
          kubectl kustomize docs/k8s/overlays/ci | grep -E '^kind: Deployment|image:'

      - name: Apply manifests
        run: kubectl apply -k docs/k8s/overlays/ci

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n "$NS" --timeout=120s
          kubectl rollout status deployment/content-service -n "$NS" --timeout=180s

      - name: Show running image (evidence)
        run: |
          kubectl get pods -n "$NS" -o wide
          kubectl describe pod -n "$NS" -l app=content-service | grep -E '^Name:|Image:|Status:'
          kubectl get pods -n "$NS" -l app=content-service \
            -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}' | grep -qx "$IMAGE"

      - name: Diagnose (only on failure)
        if: failure()
        run: |
          kubectl get pods,events -n "$NS" --sort-by=.lastTimestamp || true
          kubectl describe pod -n "$NS" -l app=content-service || true
          kubectl logs -n "$NS" -l app=content-service --all-containers --tail=50 || true
