name: PR Open — App CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  app-ci:
    uses: proops2026-simpleblog/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v1
    with:
      image-name: proops2026-simpleblog/content-service
      image-tag: ${{ github.sha }}
      push-image: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
