name: CI
on: [push, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          echo "Linting at $(date +%T)"
          sleep 10
          echo "Lint done"

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "Testing at $(date +%T)"
          sleep 10
          echo "Test done"
